<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DNI Contract System</title>
    <style>
      body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f3f4f6; margin: 0; padding: 0; }
      .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
      h1 { color: #1e3a8a; }
      button { background: #2563eb; color: white; padding: 12px 24px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
      button:hover { background: #1d4ed8; }
      input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
      .warn { border: 2px solid #eab308; background-color: #fefce8; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        document.body.innerHTML = '<div style="color:red;padding:20px;background:white;z-index:999999;position:fixed;top:0;left:0;width:100%;height:100%;"><h1>JavaScript Error</h1><pre>' + event.error.stack + '</pre></div>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML = '<div style="color:red;padding:20px;background:white;z-index:999999;position:fixed;top:0;left:0;width:100%;height:100%;"><h1>Unhandled Promise Rejection</h1><pre>' + event.reason + '</pre></div>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
